name: Hourly Member Sync and Site Build

on:
  schedule:
    - cron: '0 * * * *'    # every hour at minute 0 (UTC)
  workflow_dispatch: {}    # allow manual runs

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Create virtual environment and install deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run member sync
        env:
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
          CLAN_TAG: ${{ secrets.CLAN_TAG }}
        run: |
          source .venv/bin/activate
          python src/sync_members.py

      - name: Regenerate site
        run: |
          source .venv/bin/activate
          python src/generate_members.py

      - name: Commit generated files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data site || true
          if ! git diff --cached --quiet; then
            git commit -m "Automated hourly sync and site build: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "No changes to commit"
          fi